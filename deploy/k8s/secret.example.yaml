# EXAMPLE ONLY — do not apply this file.
#
# Every value below is a placeholder. Wire these to your secret manager
# (External Secrets, the Secrets Store CSI driver, sealed-secrets) rather than
# committing real material anywhere, and note that base64 in a Kubernetes
# Secret is encoding, not encryption: anyone who can read the object can read
# the value.
#
# DATA_KEK deserves separate handling from the rest. Losing it loses every
# subject's personal data permanently, because erasure in this system works by
# destroying per-subject keys that it wraps. Back it up somewhere that is not
# the database backup, and test the restore — see
# ../../docs/runbooks/key-rotation.md.
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-secrets
  labels:
    app.kubernetes.io/name: marketplace
type: Opaque
stringData:
  # 32 bytes each, base64 or hex. Generate with:
  #   openssl rand -base64 32
  DATA_KEK: "REPLACE-32-random-bytes-base64-encoded"
  SESSION_SIGNING_KEY: "REPLACE-32-random-bytes-base64-encoded"
  CSRF_SIGNING_KEY: "REPLACE-32-random-bytes-base64-encoded"
  DOWNLOAD_SIGN_KEY: "REPLACE-32-random-bytes-base64-encoded"

  DATABASE_URL: "postgres://user:password@host:5432/marketplace?sslmode=require"

  # Two DIFFERENT secrets serving two different signature schemes. The key
  # secret signs the checkout callback; the webhook secret signs webhook
  # bodies. Conflating them is a real vulnerability, so rotate them
  # independently and never derive one from the other.
  RAZORPAY_KEY_ID: "REPLACE"
  RAZORPAY_KEY_SECRET: "REPLACE"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE"

  STORAGE_ACCESS_KEY_ID: "REPLACE"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE"

  SMTP_HOST: "REPLACE"
  SMTP_USERNAME: "REPLACE"
  SMTP_PASSWORD: "REPLACE"

  # Without this, /metrics is world-readable. Production refuses to start.
  METRICS_TOKEN: "REPLACE"
